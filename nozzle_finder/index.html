<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nozzle Finder</title><style>*{box-sizing:border-box}body{background:#101112;color:#f4f1e8;font:16px system-ui;margin:0}main{max-width:980px;margin:auto;padding:32px 20px}h1{font-size:clamp(35px,7vw,65px);letter-spacing:-3px;margin:8px 0}small,.muted{color:#aaa}strong,a,.gold{color:#e5bb70}section,article{border:1px solid #333;border-radius:18px;padding:20px;background:#191a1c}form{display:grid;gap:14px}label{display:grid;gap:6px;font-size:13px;color:#b9b9b9}input,select,button{font:inherit;padding:13px;border:1px solid #444;border-radius:10px;background:#222;color:white;min-width:0}button{background:#e5bb70;color:#18130c;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.row,#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}#results{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:20px 0}article img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px}#status{white-space:pre-wrap}header{margin-bottom:24px}</style><main><header><small class="gold">MAKERWORLD • PROFILE DISCOVERY</small><h1>Nozzle Finder<span class="gold">.</span></h1><p class="muted">Modele cu profil exact de imprimanta si duza.</p></header><section><form id="form"><label>Cauta modele<input id="q" required placeholder="skadis, vase, storage box"></label><div class="row"><label>Imprimanta<select id="printer"><option>P2S</option><option>A1</option><option>A1 mini</option><option>P1S</option><option>X1 Carbon</option><option value="all">Toate</option></select></label><label>Duza<select id="nozzle"><option>0.2</option><option>0.4</option><option>0.6</option><option selected>0.8</option></select></label></div><label>Parola de cautare<input id="pw" type="password" autocomplete="current-password"></label><button id="go">Cauta profiluri exacte</button></form><p class="muted">Maximum 10 modele candidate per pagina. Cautarea live necesita configurarea serverului.</p></section><p id="status" role="status"></p><div id="results"></div><button id="next" hidden>Urmatoarea pagina</button></main><script>
const $=id=>document.getElementById(id);let cursor=null,last=null;function el(tag,t,parent){let x=document.createElement(tag);if(t!=null)x.textContent=t;parent.append(x);return x}function safe(u,domain){try{let x=new URL(u);return x.protocol==='https:'&&(!domain||x.hostname===domain)?x.href:null}catch{return null}}function render(m){let a=el('article',null,$('results'));let img=safe(m.coverUrl);if(img){let i=el('img',null,a);i.src=img;i.alt='';i.loading='lazy'}el('h3',m.title||'Model',a);for(let p of m.profiles){el('strong',p.printerModel+' · '+p.nozzleDiameter+' mm',a);el('p',[p.title,p.printTimeSeconds!=null?Math.round(p.printTimeSeconds/60)+' min':null,p.filamentGrams!=null?p.filamentGrams+' g':null,p.ratingScore!=null?'★ '+p.ratingScore:null].filter(Boolean).join(' · '),a)}let link=el('a','Deschide in MakerWorld',a);link.href=safe(m.modelUrl,'makerworld.com')||'https://makerworld.com/en/models/'+encodeURIComponent(m.modelId);link.target='_blank';link.rel='noopener'}async function run(more){$('go').disabled=$('next').disabled=true;$('status').textContent='Verific profilurile...';if(!more){$('results').replaceChildren();cursor=null;last={query:$('q').value,printer:$('printer').value,nozzle:$('nozzle').value}}try{let r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...last,password:$('pw').value,cursor:more?cursor:null})});let d=await r.json();if(!r.ok)throw Error(d.error);d.models.forEach(render);cursor=d.cursor;$('status').textContent=d.models.length+' modele confirmate din '+d.checked+' verificate. '+d.notes.join('; ')}catch(e){$('status').textContent=e.message}finally{$('go').disabled=$('next').disabled=false;$('next').hidden=!cursor}}$('form').onsubmit=e=>{e.preventDefault();run(false)};$('next').onclick=()=>run(true);
</script></html>
